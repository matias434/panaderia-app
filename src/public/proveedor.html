<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b321d">
  <title>Mis envíos - Panadería</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30251f;
      background: #f6f3ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { width: min(100%, 620px); margin: 0 auto; }
    header, .panel, .envio {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 10px #38291a12;
    }
    header { padding: 18px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    p { line-height: 1.45; }
    .panel { padding: 18px; margin-bottom: 14px; }
    label { display: block; margin: 12px 0 6px; font-weight: 650; }
    select, input, button {
      width: 100%;
      min-height: 48px;
      border-radius: 9px;
      font: inherit;
    }
    select, input { padding: 10px 12px; border: 1px solid #c8bdb5; background: #fff; }
    button { border: 0; padding: 12px 16px; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .principal { margin-top: 16px; color: white; background: #26733d; }
    .salir { color: #58311f; background: #f0e8e2; }
    .quitar-pedido { margin-top: 10px; color: #fff; background: #675348; }
    .envio { padding: 16px; margin: 12px 0; border: 2px solid; border-left-width: 8px; }
    .envio.pendiente { border-color: #d89b00; background: #fff9e6; }
    .envio.atrasado { border-color: #c62828; background: #fff0ef; }
    .envio.entregado { border-color: #218344; background: #edf8f0; }
    .estado-envio {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 7px 12px;
      margin-bottom: 10px;
      font-weight: 800;
      font-size: .95rem;
    }
    .estado-envio.pendiente { color: #684900; background: #ffe9a6; }
    .estado-envio.atrasado { color: #8f1717; background: #ffd8d5; }
    .estado-envio.entregado { color: #155d2b; background: #ccebd4; }
    .envio h2 { margin-bottom: 8px; }
    .envio p { margin: 8px 0; }
    .envio ul { padding-left: 22px; margin-bottom: 0; }
    .error { color: #9f1d16; font-weight: 650; }
    .secundario { color: #6a5d55; font-size: .9rem; }
    .resumen-cobro { border-top: 1px solid #e2d9d2; margin-top: 14px; padding-top: 10px; }
    .historial-pagos { margin: 8px 0; padding-left: 20px; }
    .cobro-form { border-top: 1px solid #e2d9d2; margin-top: 12px; padding-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🚚 Mis envíos</h1>
      <p id="saludo" class="secundario">Ingresá para consultar tus entregas.</p>
    </header>

    <section id="panel-acceso" class="panel">
      <h2>Acceso del repartidor</h2>
      <form id="form-acceso">
        <label for="repartidor">Soy</label>
        <select id="repartidor" required>
          <option value="">Seleccionar repartidor</option>
          <option value="Rodrigo">Rodrigo</option>
          <option value="Elsa">Elsa</option>
          <option value="Marcos">Marcos</option>
        </select>
        <label for="pin">PIN personal</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="current-password" required>
        <p id="mensaje-acceso" class="error" role="alert" hidden></p>
        <button class="principal" type="submit">Entrar a mis envíos</button>
      </form>
    </section>

    <section id="panel-envios" class="panel" hidden>
      <label for="fecha-envios">Filtrar por fecha de entrega</label>
      <input id="fecha-envios" type="date" aria-describedby="ayuda-fecha-envios">
      <p id="ayuda-fecha-envios" class="secundario">Sin fecha seleccionada se muestran los envíos de hoy y atrasados. Al elegir una fecha, se muestran los pedidos de ese día.</p>
      <button id="boton-limpiar-fecha" class="salir" type="button">Ver hoy y atrasados</button>
      <button id="boton-salir" class="salir" type="button">Cerrar sesión</button>
      <div id="listado-envios" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const formularioAcceso = document.getElementById('form-acceso');
    const panelAcceso = document.getElementById('panel-acceso');
    const panelEnvios = document.getElementById('panel-envios');
    const listadoEnvios = document.getElementById('listado-envios');
    const saludo = document.getElementById('saludo');
    const mensajeAcceso = document.getElementById('mensaje-acceso');
    const fechaEnvios = document.getElementById('fecha-envios');
    let temporizadorActualizacion;

    fechaEnvios.addEventListener('change', cargarEnvios);
    document.getElementById('boton-limpiar-fecha').addEventListener('click', () => {
      fechaEnvios.value = '';
      cargarEnvios();
    });

    formularioAcceso.addEventListener('submit', async evento => {
      evento.preventDefault();
      const boton = formularioAcceso.querySelector('button[type="submit"]');
      boton.disabled = true;
      mensajeAcceso.hidden = true;

      try {
        const respuesta = await fetch('/api/proveedor/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            repartidor: document.getElementById('repartidor').value,
            pin: document.getElementById('pin').value
          })
        });
        const resultado = await respuesta.json();
        if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo iniciar sesión');
        await mostrarEnvios(resultado.repartidor);
      } catch (error) {
        mensajeAcceso.textContent = error.message;
        mensajeAcceso.hidden = false;
      } finally {
        boton.disabled = false;
      }
    });

    async function comprobarSesion() {
      try {
        const respuesta = await fetch('/api/proveedor/sesion');
        if (!respuesta.ok) return;
        const resultado = await respuesta.json();
        await mostrarEnvios(resultado.repartidor);
      } catch (error) {
        console.error('No se pudo comprobar la sesión del repartidor:', error);
      }
    }

    async function mostrarEnvios(repartidor) {
      document.getElementById('pin').value = '';
      saludo.textContent = `Hola, ${repartidor}. Consultá tus envíos por fecha. Sin filtro se muestran los de hoy y atrasados; los entregados y cobrados se ocultan después de 8 horas.`;
      panelAcceso.hidden = true;
      panelEnvios.hidden = false;
      await cargarEnvios();
      clearInterval(temporizadorActualizacion);
      temporizadorActualizacion = setInterval(cargarEnvios, 30000);
    }

    async function cargarEnvios() {
      try {
        const parametros = new URLSearchParams();
        if (fechaEnvios.value) parametros.set('fecha', fechaEnvios.value);
        const consulta = parametros.toString();
        const respuesta = await fetch(`/api/proveedor/pedidos${consulta ? `?${consulta}` : ''}`);
        if (respuesta.status === 401) {
          cerrarSesion(false);
          return;
        }
        if (!respuesta.ok) throw new Error('No se pudieron cargar tus envíos');
        const pedidos = await respuesta.json();
        listadoEnvios.innerHTML = '';

        if (pedidos.length === 0) {
          listadoEnvios.innerHTML = fechaEnvios.value
            ? '<p>No hay pedidos tuyos para la fecha seleccionada.</p>'
            : '<p>No tenés entregas ni cobros pendientes para hoy.</p>';
          return;
        }

        const hoy = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/Argentina/Buenos_Aires'
        }).format(new Date());
        pedidos.forEach(pedido => listadoEnvios.appendChild(crearTarjeta(pedido, hoy)));
      } catch (error) {
        console.error('Error cargando envíos:', error);
        listadoEnvios.innerHTML = `<p class="error">${escaparHTML(error.message)}. Revisá tu conexión e intentá actualizar.</p>`;
      }
    }

    function crearTarjeta(pedido, hoy) {
      const tarjeta = document.createElement('article');
      const fechaEntrega = String(pedido.fecha_entrega);
      const esAtrasado = fechaEntrega < hoy;
      const entregado = String(pedido.estado || '').toLowerCase() === 'completado';
      const puedeConfirmarEntrega = !entregado && fechaEntrega <= hoy;
      const claseEstado = entregado ? 'entregado' : esAtrasado ? 'atrasado' : 'pendiente';
      const etiquetaEstado = entregado ? '✓ ENTREGADO' : esAtrasado ? '⚠ ATRASADO' : '● PENDIENTE';
      tarjeta.className = `envio ${claseEstado}`;
      const precioCargado = pedido.total_pedido !== null && pedido.total_pedido !== undefined;
      const total = precioCargado ? Number(pedido.total_pedido) : null;
      const pagado = Number(pedido.total_pagado || 0);
      const saldo = precioCargado ? Math.max(0, total - pagado) : null;
      const moneda = monto => new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        maximumFractionDigits: 2
      }).format(monto);
      const historial = Array.isArray(pedido.pagos) && pedido.pagos.length
        ? `<p><strong>Cobros registrados:</strong></p><ul class="historial-pagos">${pedido.pagos.map(pago =>
            `<li>${escaparHTML(pago.medio)}: ${moneda(Number(pago.monto))}</li>`
          ).join('')}</ul>`
        : '<p class="secundario">Todavía no hay cobros registrados.</p>';
      tarjeta.innerHTML = `
        <div class="estado-envio ${claseEstado}" role="status">${etiquetaEstado}</div>
        <h2>Pedido #${Number(pedido.id)} — ${escaparHTML(pedido.cliente_nombre)}</h2>
        <p><strong>Fecha de entrega:</strong> ${escaparHTML(fechaEntrega.split('-').reverse().join('/'))}</p>
        <ul>${pedido.items.map(item => `<li><strong>${escaparHTML(item.cantidad)} ${escaparHTML(item.unidad || '')}</strong> — ${escaparHTML(item.producto_nombre)}</li>`).join('')}</ul>
        <div class="resumen-cobro">
          ${precioCargado
            ? `<p><strong>Total del pedido:</strong> ${moneda(total)}</p><p><strong>Cobrado:</strong> ${moneda(pagado)}</p><p><strong>Saldo de este pedido:</strong> ${moneda(saldo)}</p>${historial}`
            : '<p class="error">Pedido todavía sin valorizar. Consultá a Secretaría para ver el total y registrar un cobro.</p>'
          }
        </div>
        ${entregado
          ? '<p><strong>Entrega:</strong> Confirmada</p>'
          : puedeConfirmarEntrega
            ? '<button class="principal" data-action="entregar" type="button">Confirmar entrega realizada</button>'
            : '<p class="secundario">La entrega se podrá confirmar a partir de la fecha indicada.</p>'
        }
        ${entregado
          ? '<button class="quitar-pedido" data-action="ocultar" type="button">Quitar de Mis envíos</button>'
          : ''
        }
        ${entregado && precioCargado && saldo > 0
          ? `<form class="cobro-form">
              <label>Monto recibido</label>
              <input name="monto" type="number" min="0.01" max="${saldo.toFixed(2)}" step="0.01" inputmode="decimal" required>
              <label>Medio de pago</label>
              <select name="medio" required>
                <option value="">Seleccionar medio</option>
                <option value="Efectivo">Efectivo</option>
                <option value="Mercado Pago">Mercado Pago</option>
              </select>
              <button class="principal" type="submit">Registrar cobro</button>
            </form>`
          : ''
        }
      `;
      const botonEntrega = tarjeta.querySelector('[data-action="entregar"]');
      if (botonEntrega) botonEntrega.addEventListener('click', () => confirmarEntrega(pedido.id));
      const botonOcultar = tarjeta.querySelector('[data-action="ocultar"]');
      if (botonOcultar) botonOcultar.addEventListener('click', () => ocultarPedido(pedido.id, botonOcultar));
      const formularioCobro = tarjeta.querySelector('.cobro-form');
      if (formularioCobro) {
        formularioCobro.addEventListener('submit', evento => registrarCobro(evento, pedido.id));
      }
      return tarjeta;
    }

    async function confirmarEntrega(id) {
      if (!window.confirm(`¿Confirmás que realizaste la entrega del pedido #${id}?`)) return;
      const boton = Array.from(listadoEnvios.querySelectorAll('.envio')).find(tarjeta =>
        tarjeta.querySelector('h2').textContent.startsWith(`Pedido #${id} —`)
      )?.querySelector('[data-action="entregar"]');
      if (boton) boton.disabled = true;

      try {
        const respuesta = await fetch(`/api/proveedor/pedidos/${id}/entregar`, { method: 'PATCH' });
        const resultado = await respuesta.json();
        if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo confirmar la entrega');
        await cargarEnvios();
      } catch (error) {
        console.error('Error confirmando entrega:', error);
        window.alert(`❌ ${error.message}`);
        if (boton) boton.disabled = false;
      }
    }

    async function ocultarPedido(id, boton) {
      if (!window.confirm(`¿Quitar el pedido #${id} de Mis envíos? El pedido y sus cobros se conservarán para Secretaría, pero ya no aparecerá en tu lista.`)) return;
      boton.disabled = true;
      try {
        const respuesta = await fetch(`/api/proveedor/pedidos/${id}/ocultar`, { method: 'PATCH' });
        const resultado = await respuesta.json();
        if (respuesta.status === 401) {
          cerrarSesion(false);
          return;
        }
        if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo quitar el pedido de Mis envíos');
        await cargarEnvios();
      } catch (error) {
        console.error('Error quitando pedido de Mis envíos:', error);
        window.alert(`❌ ${error.message}`);
        boton.disabled = false;
      }
    }

    async function registrarCobro(evento, id) {
      evento.preventDefault();
      const formulario = evento.currentTarget;
      const boton = formulario.querySelector('button[type="submit"]');
      boton.disabled = true;
      try {
        const respuesta = await fetch(`/api/proveedor/pedidos/${id}/pagos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            monto: formulario.elements.monto.value,
            medio: formulario.elements.medio.value
          })
        });
        const resultado = await respuesta.json();
        if (respuesta.status === 401) {
          cerrarSesion(false);
          return;
        }
        if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo registrar el cobro');
        await cargarEnvios();
      } catch (error) {
        console.error('Error registrando el cobro:', error);
        window.alert(`❌ ${error.message}`);
        boton.disabled = false;
      }
    }

    async function cerrarSesion(llamarApi = true) {
      clearInterval(temporizadorActualizacion);
      if (llamarApi) {
        try {
          await fetch('/api/proveedor/logout', { method: 'POST' });
        } catch (error) {
          console.error('Error al cerrar sesión del repartidor:', error);
        }
      }
      listadoEnvios.innerHTML = '';
      panelEnvios.hidden = true;
      panelAcceso.hidden = false;
      saludo.textContent = 'Ingresá para consultar tus entregas.';
    }

    function escaparHTML(texto) {
      return String(texto).replace(/[&<>"']/g, caracter => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[caracter]);
    }

    document.getElementById('boton-salir').addEventListener('click', () => cerrarSesion());
    comprobarSesion();
  </script>
</body>
</html>
